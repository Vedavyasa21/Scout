name: Feature request
description: Propose a capability or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that Scout cannot do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior and, if relevant, the tool schema and permission level.
    validations:
      required: true
  - type: dropdown
    id: milestone
    attributes:
      label: Milestone fit
      options:
        - Milestone 1 - foundation
        - Milestone 2 - permissions, memory, audit
        - Milestone 3 - writes, terminal, developer tools
        - Milestone 4 - browser, web search, documents
        - Milestone 5 - voice and desktop
        - Milestone 6 - plugins and packaging
        - Not sure
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Security considerations
      description: What could go wrong, and how should Scout limit it?
    validations:
      required: true
