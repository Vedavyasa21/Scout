name: Bug report
description: Something does not work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please redact API keys and personal paths.
        For security vulnerabilities, use the Security tab instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Observed behavior, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `scout ask "..."`
        2. ...
      render: shell
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Scout doctor output
      description: Output of `scout doctor` with secrets removed.
      render: shell
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Scout version
      description: Output of `scout --version`
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS and Python
      placeholder: Windows 11 23H2, Python 3.13.2
    validations:
      required: true
